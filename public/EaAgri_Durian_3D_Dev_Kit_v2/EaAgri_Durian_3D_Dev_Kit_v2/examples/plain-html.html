<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ví dụ nhúng EaAgri 3D</title>
  <link rel="stylesheet" href="../dist/eaagri-3d.css">
  <style>body{font-family:system-ui;background:#eef9ef;margin:0}main{max-width:740px;margin:auto}#durian{height:660px;width:100%}#event{padding:12px;font-size:14px}</style>
</head>
<body>
  <main><div id="durian"></div><p id="event" role="status">Chưa kết nối dữ liệu vườn.</p></main>
  <script type="module">
    import {createEaAgriScene} from '../dist/eaagri-3d.js';
    const viewer=createEaAgriScene(document.querySelector('#durian'),{
      assetBaseUrl:new URL('../assets/',import.meta.url).href,
      posterUrl:new URL('../assets/poster.png',import.meta.url).href,
      quality:'auto',
      onSelect:({id})=>{document.querySelector('#event').textContent='Mở chức năng tương ứng: '+id;},
    });
    // When real data arrives: viewer.setData({source:'live',moistureTop:68});
    // In a SPA component, call viewer.destroy() on unmount.
  </script>
</body>
</html>
